name: Android Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version stamped into the APK, such as 2.0.4 or 2.0.4-beta.1. Empty keeps 2.0.3.'
        required: false
        type: string
        default: ''
      allow_unsigned:
        description: 'False for a build that publishes a release: it then fails unless the project keystore is available.'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The native dependency build (openssl/libsodium/sqlcipher/ffmpeg) is the long
# part. A newer push supersedes an in-flight run, so cancel the old one instead
# of paying for it.
concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Pinned to the revision app/build.gradle.kts declares as its ndkVersion.
      # It is published in the stable SDK channel (channel-0), so a plain
      # `sdkmanager --install` finds it.
      NDK_VERSION: "30.0.14904198"
      # Runner image default; also what scripts/android/build-android-core.sh
      # searches when ANDROID_NDK_ROOT is unset.
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK environment
        run: |
          set -euo pipefail
          # Deliberately not android-actions/setup-android: its default package
          # list is "tools", a package Google removed from the SDK repository, so
          # the action hard-fails with "Failed to find package 'tools'" before
          # any of our steps run. The runner image already ships the SDK and
          # cmdline-tools; locate sdkmanager and put it on PATH ourselves.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BIN=""
          for d in "$SDK"/cmdline-tools/*/bin "$SDK"/cmdline-tools/latest/bin "$SDK"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then BIN="$d"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "::error::no sdkmanager found under $SDK"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "sdkmanager: $BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          # v2: the previous cache archive failed to unpack (tar exit 2) and
          # left an NDK directory sdkmanager still treated as installed.
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-v2-${{ runner.os }}-${{ env.NDK_VERSION }}
          restore-keys: android-sdk-v2-${{ runner.os }}-

      - name: Install SDK packages + host tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" >/dev/null
          # A failed cache unpack can leave package.xml in place while the
          # toolchain file is missing. sdkmanager then skips the package.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          TOOLCHAIN="$SDK/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"
          if [ ! -f "$TOOLCHAIN" ]; then
            echo "NDK toolchain missing after install; clearing the package and retrying"
            rm -rf "$SDK/ndk/${NDK_VERSION}"
            sdkmanager --install "ndk;${NDK_VERSION}"
          fi
          test -f "$TOOLCHAIN"
          sudo apt-get update -qq
          # cmake is not on the runner image. The core script exits immediately
          # without it, before it compiles anything. ninja and make drive that
          # build; qemu-user runs the aarch64 tests; tcl is optional.
          sudo apt-get install -y -qq cmake make ninja-build tcl qemu-user
          command -v cmake
          command -v ninja
          command -v make

      - name: Cache cross-built deps + core
        uses: actions/cache@v4
        with:
          path: out/android-arm64
          # No restore-keys: a partial or older tree still counts as a hit and
          # the core script then exits in the first second.
          key: core-arm64-${{ runner.os }}-${{ hashFiles('scripts/android/build-android-core.sh', 'core/**', 'CMakeLists.txt') }}

      - name: Build Android core (deps + static libs + aarch64 tests)
        run: |
          set +e
          set +o pipefail
          # Use the SDK path written by the setup step, not the job-level default.
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          bash scripts/android/build-android-core.sh 2>&1 | tee "$RUNNER_TEMP/android-core.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg="$(tail -n 20 "$RUNNER_TEMP/android-core.log" | tr '\n' ' ' | sed 's/::/:/g' | head -c 1800)"
            echo "::error title=Android core build failed::${msg}"
            exit "$rc"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signing is what lets an installed copy be replaced by a newer download:
      # Android refuses an update whose certificate differs from the one already
      # on the phone, which is why every earlier release (fresh debug key per
      # run) could never install over the previous one. The keystore and its
      # password live in the repository secrets, and the verification step below
      # checks the APK really carries this certificate. A fork pull request has
      # no secrets and falls back to a debug build, which publishes nothing.
      - name: Prepare the release keystore
        env:
          EXPECTED_SIGNER: ba94bf1cde8978456e21b5b35cc86382695816faea1a4ccbc9f7ce629da56bfe
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "EXPECTED_SIGNER=$EXPECTED_SIGNER" >> "$GITHUB_ENV"
          signed=false
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/MegaVaultProtect-release.p12"
            echo "MVP_KEYSTORE=$RUNNER_TEMP/MegaVaultProtect-release.p12" >> "$GITHUB_ENV"
            echo "ASSEMBLE_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            signed=true
            echo "The project keystore is available; building a signed release APK."
          else
            echo "ASSEMBLE_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret here, so this build is an unsigned-for-release debug APK."
          fi
          echo "SIGNED=$signed" >> "$GITHUB_ENV"
          if [ "$signed" = "false" ] && [ "${{ inputs.allow_unsigned }}" = "false" ]; then
            echo "::error::This run publishes a release, so it must be signed with the project keystore. ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

      - name: Build the APK
        env:
          MVP_ANDROID_PREFIX: ${{ github.workspace }}/out/android-arm64/prefix
          MVP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MVP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MVP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          # The wrapper distribution is pinned to the mirror reachable from the
          # developer's network. If that mirror is ever unavailable, fall back to
          # the official distribution before failing the job.
          if ! MVP_VERSION="${{ inputs.version }}" ./gradlew --no-daemon "$ASSEMBLE_TASK"; then
            echo "::warning::gradlew failed; retrying with the official Gradle distribution"
            # Written with printf rather than sed: the backslash that escapes the
            # colon in a .properties value must survive shell + YAML layers.
            printf 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip\n' \
              > gradle/wrapper/gradle-wrapper.properties
            MVP_VERSION="${{ inputs.version }}" ./gradlew --no-daemon "$ASSEMBLE_TASK"
          fi

      - name: Verify the APK carries a working native core
        env:
          NDK_PATH: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          APK="$APK_PATH"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmvpcore.so'
          unzip -l "$APK" | grep -q 'classes.dex'
          # A broken native link still produces an APK — a dead one. Assert the
          # JNI entry points the Kotlin side declares are really exported.
          NM="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" 'lib/arm64-v8a/libmvpcore.so' -d /tmp/apkcheck
          SO=/tmp/apkcheck/lib/arm64-v8a/libmvpcore.so
          "$NM" -D --defined-only "$SO" > /tmp/apkcheck/symbols.txt
          for sym in \
            nativeVaultExists nativeCreateVault nativeOpenVault nativeLock \
            nativeListVideos nativeImportFile nativeRemoveVideo nativeThumbnail \
            nativeMediaInfo nativeRestoreVideo nativeListTags nativeAddTag \
            nativeDecodeFrame nativeCreateTag nativeVideoSize nativeReadRange; do
            grep -q "_${sym}" /tmp/apkcheck/symbols.txt \
              || { echo "MISSING JNI SYMBOL: $sym"; exit 1; }
          done
          echo "libmvpcore.so: $(grep -c . /tmp/apkcheck/symbols.txt) dynamic symbols, all JNI entry points present"
          ls -la "$APK"

          # The signature is what decides whether an installed copy can update
          # to this APK at all, so it is checked here rather than trusted: a
          # missing secret or a swapped key would otherwise ship a build that
          # every phone refuses to install over the previous one.
          if [ "$SIGNED" = "true" ]; then
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
            grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER" "$RUNNER_TEMP/apk-certs.txt" \
              || { echo "::error::The APK is not signed by the project keystore ($EXPECTED_SIGNER), so installed copies cannot update to it."; exit 1; }
            echo "Signed by the project keystore, so it installs over the previous release."
          else
            echo "::warning::Unsigned build (no keystore secret); not suitable for release."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaVaultProtect-android-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          APK="${APK_PATH:-android/app/build/outputs/apk/debug/app-debug.apk}"
          {
            echo "### Android arm64-v8a"
            echo
            if [ -f "$APK" ]; then
              echo "APK: \`$APK\` ($(stat -c%s "$APK") bytes, signed=${SIGNED:-unknown})"
            else
              echo "No APK was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
