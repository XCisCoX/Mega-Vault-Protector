name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 13 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK environment
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BIN=""
          for d in "$SDK"/cmdline-tools/*/bin "$SDK"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then BIN="$d"; break; fi
          done
          test -n "$BIN" || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
          echo "$BIN" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/30.0.14904198" >> "$GITHUB_ENV"
          echo "MVP_ANDROID_PREFIX=$GITHUB_WORKSPACE/out/android-arm64/prefix" >> "$GITHUB_ENV"

      - name: Install Android packages and native build tools
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1"
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake make ninja-build tcl qemu-user

      - name: Cache Android native dependencies
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v4
        with:
          path: out/android-arm64
          key: codeql-native-v1-${{ runner.os }}-ndk30-${{ hashFiles('scripts/android/build-android-core.sh', 'core/**', 'CMakeLists.txt') }}

      # Native dependencies are prepared before Kotlin tracing starts.
      - name: Build Android native core
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: bash scripts/android/build-android-core.sh

      - name: Use official Gradle distribution
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          lines = p.read_text().splitlines()
          replacement = r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip'
          p.write_text('\n'.join(replacement if line.startswith('distributionUrl=') else line for line in lines) + '\n')
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Compile after init. Avoid cached/up-to-date compiler outputs so CodeQL
      # observes the Kotlin compilation rather than only packaging old classes.
      - name: Build Android app for Kotlin analysis
        if: matrix.language == 'java-kotlin'
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            -Pkotlin.compiler.execution.strategy=in-process \
            clean :app:assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
