name: Release

# Publishes one GitHub Release with three downloads: Windows x64, Linux x64,
# and Android arm64. The version is chosen here. Actions -> Release ->
# Run workflow takes the next unused tag after the highest vX.Y.Z
# (v2.0.3 becomes v2.0.4). A pushed v* tag builds that exact tag instead.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Node-runtime note: all actions here run on Node 24 (checkout@v5; the
# floating @v4/@v2 tags track their maintainers' Node 24 releases). No
# Node 20-only actions are used, so the fall-2026 Node 20 removal on runners
# cannot break this workflow.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      number: ${{ steps.pick.outputs.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reserve the next unused version
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=""
            for _attempt in 1 2 3 4 5; do
              git fetch origin --tags --force
              tag="$(bash scripts/next-version.sh)"
              if git tag "$tag" && git push origin "refs/tags/$tag"; then
                break
              fi
              git tag -d "$tag" || true
              tag=""
            done
            if [ -z "$tag" ]; then
              echo "Could not reserve a new version tag." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "### Version" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: version
    # Pinned instead of the floating windows-latest: when that label moves to
    # a newer image, CMake's "Visual Studio 17 2022" generator can fail VS
    # discovery at project() with "could not find any instance of Visual
    # Studio". windows-2022 ships the VS 2022 toolset (17.x) this project's
    # Qt 5.12.12 msvc2017_64 kit and MSVC 14.44 toolchain target.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 5.12.12 (msvc2017_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.12.12'
          arch: 'win64_msvc2017_64'
          cache: true

      # Diagnostic: confirms which Visual Studio (if any) the runner exposes.
      # CMake's VS generator resolves installations through the same vswhere
      # query, so this makes a future detection failure self-explanatory.
      - name: Detect Visual Studio (diagnostic)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
      # The repo pins a vcpkg baseline (b1b19307...) that preinstalled runner
      # vcpkg copies may not resolve, and resolving it needs vcpkg's own git
      # history. That baseline never changes between builds, so the tool and its
      # registry come back from cache instead of being cloned on every run.
      - name: Cache the vcpkg tool and registry
        id: vcpkg-tool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg
          key: vcpkg-tool-${{ runner.os }}-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          Write-Output "vcpkg tool cache: ${{ steps.vcpkg-tool.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
          if (-not (Test-Path "$root\.git")) {
            # A miss needs a FULL clone: a shallow one cannot resolve the baseline.
            git clone https://github.com/microsoft/vcpkg.git $root
          }
          if (-not (Test-Path "$root\vcpkg.exe")) {
            & "$root\bootstrap-vcpkg.bat" -disableMetrics
          }

      # ffmpeg is the expensive port (15-20 minutes even with the release-only
      # triplet). Caching the installed tree turns `vcpkg install` into a
      # validation pass of seconds. The key follows the baseline, the manifest
      # and the overlay triplet, so a dependency change starts a clean tree.
      - name: Cache the built dependencies
        id: vcpkg-installed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01-${{ hashFiles('vcpkg.json', 'third_party/vcpkg-overlays/triplets/x64-windows-release.cmake') }}
      - name: Install dependencies (argon2, libsodium, sqlcipher, ffmpeg)
        shell: pwsh
        env:
          # Speed: two independent wins.
          # 1) The x64-windows-release overlay triplet (third_party/
          #    vcpkg-overlays/triplets) builds only the Release configuration
          #    — without it vcpkg builds every port twice and ffmpeg alone
          #    spent ~19 min per configuration.
          # 2) VCPKG_BINARY_SOURCES=x-gha caches built ports in the GitHub
          #    Actions cache service (the runner provides ACTIONS_CACHE_URL /
          #    ACTIONS_RUNTIME_TOKEN automatically), so later runs restore
          #    ffmpeg/openssl/etc. from cache instead of recompiling.
          VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
        run: |
          Write-Output "dependency cache: ${{ steps.vcpkg-installed.outputs.cache-hit == 'true' && 'hit (verify only)' || 'miss (building)' }}"
          # --vcpkg-root overrides the runner's VS-installed VCPKG_ROOT env
          # (otherwise vcpkg detects the temp root and warns about the mismatch).
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install `
            --vcpkg-root="$env:RUNNER_TEMP\vcpkg" `
            --triplet x64-windows-release `
            --overlay-triplets="$env:GITHUB_WORKSPACE\third_party\vcpkg-overlays\triplets" `
            --x-install-root="$env:RUNNER_TEMP\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      # vcpkg's ffmpeg port installs stub import libs; rebuild them from the
      # DLL export tables (same step as local builds; paths come from env).
      # MSVC is located by the script itself via vswhere (no dev-cmd step).
      - name: Regenerate FFmpeg import libraries
        shell: bash
        env:
          MVP_VCPKG_INSTALLED: ${{ runner.temp }}\vcpkg_installed\x64-windows-release
          MVP_FFMPEG_DEFS: ${{ runner.temp }}\ffmpeg-defs
        run: bash scripts/regenerate-ffmpeg-importlibs.sh

      # Qt 5.12 loads OpenSSL 1.1 by name (libssl-1_1-x64.dll). The rest of the
      # package is OpenSSL 3, so nothing satisfied Qt and every HTTPS request
      # QNetworkAccessManager made — cloud sync, and the provider plugin — failed
      # before it was sent. Build the 1.1 runtime Qt expects and ship it beside
      # the exe; the app's own crypto keeps using OpenSSL 3 under different names.
      # Building 1.1.1w costs several minutes and yields the same two DLLs every
      # time, so the build output is cached by commit; a hit skips configure and
      # nmake and only re-verifies the files.
      - name: Cache OpenSSL 1.1 for Qt TLS
        id: openssl11
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openssl11
          key: openssl11-${{ runner.os }}-e04bd3433fd84e1861bf258ea37928d9845e6a86
      - name: Build OpenSSL 1.1 for Qt TLS
        if: steps.openssl11.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          OPENSSL_COMMIT: e04bd3433fd84e1861bf258ea37928d9845e6a86
        run: |
          $src = "$env:RUNNER_TEMP\openssl11"
          git clone --quiet --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git $src
          $head = git -C $src rev-parse HEAD
          if ($head -ne $env:OPENSSL_COMMIT) { throw "OpenSSL_1_1_1w moved: $head" }
          Push-Location $src
          perl Configure VC-WIN64A no-asm no-tests no-comp
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL configure failed" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && nmake /nologo"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed" }
          Pop-Location
          foreach ($dll in @("libssl-1_1-x64.dll", "libcrypto-1_1-x64.dll")) {
            if (-not (Test-Path "$src\$dll")) { throw "OpenSSL did not produce $dll" }
          }
      - name: Verify the Qt TLS runtime
        shell: pwsh
        run: |
          foreach ($dll in @("libssl-1_1-x64.dll", "libcrypto-1_1-x64.dll")) {
            if (-not (Test-Path "$env:RUNNER_TEMP\openssl11\$dll")) { throw "Qt TLS runtime missing: $dll" }
          }
          Write-Output "Qt TLS runtime ready (cache: ${{ steps.openssl11.outputs.cache-hit == 'true' && 'hit' || 'built' }})"

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake --preset vs2022-x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DVCPKG_INSTALLED_DIR="$env:RUNNER_TEMP\vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\third_party\vcpkg-overlays\triplets" `
            -DVCPKG_INSTALL_OPTIONS="" `
            -DCMAKE_SYSTEM_VERSION="" `
            -DMVP_VERSION="${{ needs.version.outputs.number }}"

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build out/build/vs2022-x64 --config Release -- /m

      - name: Run tests (Release)
        shell: pwsh
        run: |
          # Prepend the runtime DLL dirs INSIDE the step. An env-block PATH
          # override would use $(PATH), which GitHub Actions does not expand
          # (only double-brace template expressions are) — PowerShell then
          # evaluates $(PATH) to an empty string and the system PATH (and
          # ctest with it) is lost.
          $env:PATH = "$env:RUNNER_TEMP\vcpkg_installed\x64-windows-release\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir out/build/vs2022-x64 -C Release --output-on-failure

      - name: Package application
        shell: pwsh
        run: |
          $exeDir = "out/build/vs2022-x64/qt-app/Release"
          $exe = "$exeDir\MegaVaultProtect.exe"
          if (-not (Test-Path $exe)) { throw "Release exe not found: $exe" }
          $staging = "$env:RUNNER_TEMP\package"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe $staging
          # Ship EVERY runtime DLL the linker resolved (staged next to the exe
          # by the POST_BUILD TARGET_RUNTIME_DLLS copy): Qt, argon2, libsodium,
          # sqlcipher, libcrypto (OpenSSL), and FFmpeg. The previous hand-
          # picked list forgot argon2/libsodium/sqlcipher, which made the zip
          # fail on clean machines.
          Get-ChildItem "$exeDir\*.dll" | Copy-Item -Destination $staging
          # Qt's own TLS dependency, built above; it lives outside the exe dir.
          Copy-Item "$env:RUNNER_TEMP\openssl11\libssl-1_1-x64.dll",
                    "$env:RUNNER_TEMP\openssl11\libcrypto-1_1-x64.dll" $staging
          # Gather Qt platform plugins, styles, ICU, etc.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations "$staging\MegaVaultProtect.exe"
          # Defensive: the crypto stack and the five FFmpeg DLLs must be in the
          # package (throw with a clear message if any are missing).
          foreach ($dll in @("argon2.dll","libsodium.dll","sqlcipher.dll","libcrypto-3-x64.dll","libssl-1_1-x64.dll","libcrypto-1_1-x64.dll","zlib1.dll","avcodec-61.dll","avformat-61.dll","avutil-59.dll","swscale-8.dll","swresample-5.dll")) {
            if (-not (Test-Path "$staging\$dll")) { throw "Missing runtime DLL in package: $dll" }
          }
          Compress-Archive -Path "$staging\*" -DestinationPath "$env:RUNNER_TEMP\MegaVaultProtect-windows-x64.zip" -Force
          Write-Output "Packaged:"
          Get-ChildItem $staging | Select-Object -ExpandProperty Name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaVaultProtect-windows-x64
          path: ${{ runner.temp }}/MegaVaultProtect-windows-x64.zip

  build-linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Qt 5, FFmpeg, SQLCipher, Argon2, libsodium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qtbase5-dev qtmultimedia5-dev libqt5multimedia5-plugins \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libsqlcipher-dev libargon2-dev libsodium-dev zlib1g-dev libssl-dev \
            libxcb-cursor0 libxcb-xinerama0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Configure (Release)
        run: cmake --preset linux-release -DMVP_VERSION="${{ needs.version.outputs.number }}"

      - name: Build (Release)
        run: cmake --build --preset linux-release -j "$(nproc)"

      - name: Run tests (Release, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir out/build/linux-release -C Release --output-on-failure

      - name: Package application
        run: |
          bash scripts/package-linux-release.sh \
            out/build/linux-release/qt-app/MegaVaultProtect \
            "$RUNNER_TEMP/MegaVaultProtect-linux-x64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaVaultProtect-linux-x64
          path: ${{ runner.temp }}/MegaVaultProtect-linux-x64.tar.gz

  build-android:
    needs: version
    uses: ./.github/workflows/android-build.yml
    # A called workflow does not see repository secrets unless the caller passes
    # them, so the keystore has to be inherited here: without it the job finds
    # no ANDROID_KEYSTORE_BASE64 and (correctly) refuses to build an unsigned
    # release. Push-triggered runs of android-build.yml are called by nobody and
    # read the secrets directly, which is why only this path was affected.
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.number }}
      # A published release must be signed with the project keystore: without it
      # no phone can install this APK over the previous one.
      allow_unsigned: false

  release:
    needs: [version, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The notes diff against the previous published tag.
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/artifacts"
          ls -la "$dir"
          test -f "$dir/MegaVaultProtect-windows-x64.zip"
          test -f "$dir/MegaVaultProtect-linux-x64.tar.gz"
          test -f "$dir/app-release.apk"
          mv "$dir/app-release.apk" "$dir/MegaVaultProtect-android-arm64.apk"

      # Deterministic change summary since the previous release tag, optionally
      # written as prose by an OpenAI-compatible endpoint when
      # MVP_NOTES_API_KEY is configured. Without the secret the notes are still
      # accurate and the release never depends on a network service.
      - name: Generate release notes
        shell: bash
        env:
          MVP_NOTES_API_KEY: ${{ secrets.MVP_NOTES_API_KEY }}
          MVP_NOTES_MODEL: ${{ vars.MVP_NOTES_MODEL }}
          MVP_NOTES_ENDPOINT: ${{ vars.MVP_NOTES_ENDPOINT }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py \
            --auto \
            --version "${{ needs.version.outputs.tag }}" \
            --to "${{ needs.version.outputs.tag }}" \
            --out "$RUNNER_TEMP/notes.md"
          {
            echo "Windows, Linux, and Android downloads for this version."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "- **Windows x64:** unzip and run \`MegaVaultProtect.exe\`."
            echo "- **Linux x64:** extract and run \`./MegaVaultProtect.sh\`. Built on Ubuntu 24.04; needs glibc 2.39 or newer. Libraries are in the archive."
            echo "- **Android (arm64):** install \`MegaVaultProtect-android-arm64.apk\` on an arm64 phone running Android 8 or newer. Allow installs from your browser or file manager. It is signed with the project release key, so a newer build installs straight over the copy you already have — including from the update icon inside the app."
            echo
            echo "The vault stays on your machine. Playback does not decrypt videos onto disk."
          } > "$RUNNER_TEMP/body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Mega Vault Protect ${{ needs.version.outputs.tag }}
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/body.md
          files: |
            ${{ runner.temp }}/artifacts/MegaVaultProtect-windows-x64.zip
            ${{ runner.temp }}/artifacts/MegaVaultProtect-linux-x64.tar.gz
            ${{ runner.temp }}/artifacts/MegaVaultProtect-android-arm64.apk
