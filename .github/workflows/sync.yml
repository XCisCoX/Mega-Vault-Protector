name: sync

# The relay, its web console and the client protocol have no other CI: this is
# the only thing that keeps sync_server/, sync_web/ and the clients honest on a
# pull request. The native client's live end-to-end run needs the full Qt
# toolchain and is exercised locally with
#   python qt-app/tests/run_sync_live.py <VideoVaultSyncEngineTests>
on:
  push:
    branches: [main]
    paths:
      - 'sync_server/**'
      - 'sync_web/**'
      - 'tests/sync_server/**'
      - 'android/sync-tests/**'
      - 'android/SYNC_V3.md'
      - 'docs/sync-*.md'
      - 'deployment/**'
      - '.github/workflows/sync.yml'
  pull_request:
    paths:
      - 'sync_server/**'
      - 'sync_web/**'
      - 'tests/sync_server/**'
      - 'android/sync-tests/**'
      - 'deployment/**'
      - '.github/workflows/sync.yml'
  workflow_dispatch:

jobs:
  relay:
    name: relay tests (real server, real sockets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every test file runs the actual CLI and server binary
        run: |
          status=0
          for file in tests/sync_server/test_*.py; do
            echo "::group::${file}"
            python "$file" -v || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: The server refuses to run without TLS off loopback
        run: |
          python -m sync_server --data "$RUNNER_TEMP/data" serve \
            --host 0.0.0.0 --port 18766 && exit 1 || true
      - name: Operator CLI answers --help
        run: |
          python -m sync_server --data "$RUNNER_TEMP/data2" --help
          python -m sync_server --data "$RUNNER_TEMP/data2" gc --help

  android-guards:
    name: android client static guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python android/sync-tests/test_integration.py -v
